name: watch daily (ministries and regulators)

on:
  schedule:
    - cron: "0 4 * * *"    # 09:30 IST
    - cron: "0 13 * * *"   # 18:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gov-watch-push
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Check daily tier
        run: python scripts/check.py --tier daily

      - name: Send digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python scripts/notify.py --mode digest
        continue-on-error: true

      - name: Rebuild feed
        if: always()
        run: python scripts/build_site.py

      - name: Commit
        if: always()
        run: |
          git config user.name "gov-watch"
          git config user.email "actions@github.com"
          git add -A snapshots data docs
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "daily check $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Another runner (or the Mac) may have pushed while we were fetching.
          # Rebase onto whatever landed and try again rather than failing.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts"
          exit 1
