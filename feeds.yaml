  - slug: cjp-reported
    name: "CJP — reported coverage"
    kind: gnews
    query: '"Cockroach Janta Party" OR "Cockroach Janata Party"'
    tier: 1
    cadence: fast
    lang: en
    country: IN
    trust: reported
    verified: true
    notes: >
      Reported coverage only. The movement's own domains are deliberately NOT
      in this file. At least five sites present themselves as the official CJP
      home and they publish conflicting versions of the demands, so at least
      one is fabricating. Wikipedia gives cockroachjantaparty.org as official.
      Verify by hand, then add it as a separate entry with trust: primary.
      Until then, nothing from a movement domain can trigger an alert.
